[profile.default]
src = "src"
out = "out"
libs = ["lib"]

[etherscan]
# Etherscan API v2 (one key for every chain). Verify with: forge verify-contract <addr> <path:Contract> --chain <id> --verifier etherscan
base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=8453" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=84532" }
