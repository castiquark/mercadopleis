# Netlify Configuration for mercadopleis (Next.js Monorepo)

[build]
  base = "."
  publish = "apps/web/.next"
  command = "pnpm --filter @mercadopleis/types build && pnpm --filter @mercadopleis/contracts-abi build && pnpm --filter @mercadopleis/web build"
  # Skip the build (exit 0) when nothing the site uses changed, e.g. commits that only touch contracts, docs or
  # the MCP server. A commit message with [skip netlify] also skips it.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web packages/types packages/contracts-abi packages/database package.json pnpm-lock.yaml pnpm-workspace.yaml netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--version"
  SECRETS_SCAN_OMIT_KEYS = "NEON_STORAGE_REGION"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers for Web3 / Cross-Origin Security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
