# Netlify Configuration for mercadopleis (Next.js Monorepo)

[build]
  base = "."
  publish = "apps/web/.next"
  command = "pnpm --filter @mercadopleis/types build && pnpm --filter @mercadopleis/contracts-abi build && pnpm --filter @mercadopleis/mcp-server build && pnpm --filter @mercadopleis/web build"
  # The web app serves the remote MCP endpoint (/mcp) from packages/mcp-server, so that package is built first.
  # Skip the build (exit 0) when nothing the site uses changed, e.g. commits that only touch contracts or docs.
  # A commit message with [skip netlify] also skips it.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web packages/types packages/contracts-abi packages/database packages/mcp-server package.json pnpm-lock.yaml pnpm-workspace.yaml netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--version"
  SECRETS_SCAN_OMIT_KEYS = "NEON_STORAGE_REGION"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers for Web3 / Cross-Origin Security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Agent discovery files (generated from packages/mcp-server by apps/web/scripts/gen-well-known.mjs): static,
# public and read by crawlers from any origin. Netlify sets Content-Type from the extension (.json).
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
